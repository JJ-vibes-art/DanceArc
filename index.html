<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance Motion Art</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.0/dist/pose-detection.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background: #0a0a0a; color: #e0e0e0; }
        .canvas-container { position: relative; width: 100%; height: 600px; }
        #canvas2D, #canvas3D { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #canvas3D { display: none; }
        .control-panel { background: #1a1a1a; border: 1px solid #333; }
        .progress-bar { transition: width 0.3s ease; }
        .glow-text { text-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }
    </style>
</head>
<body class="min-h-screen font-sans">

<header class="border-b border-gray-800 py-6 px-8">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold glow-text text-cyan-400">Dance Motion Art</h1>
            <p class="text-gray-500 mt-1">上传舞蹈视频，生成真实的运动轨迹艺术</p>
        </div>
        <a href="https://github.com/JJ-vibes-art/DanceArc" target="_blank" class="px-4 py-2 bg-gray-800 rounded-lg hover:bg-gray-700 transition">GitHub</a>
    </div>
</header>

<main class="max-w-7xl mx-auto p-8">

    <section id="uploadSection" class="mb-8">
        <div class="border-2 border-dashed border-gray-700 rounded-2xl p-12 text-center hover:border-cyan-500 transition cursor-pointer" onclick="document.getElementById('videoInput').click()">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gray-800 flex items-center justify-center text-cyan-400 text-4xl">📹</div>
            <p class="text-lg mb-2">点击上传舞蹈视频</p>
            <p class="text-sm text-gray-500">支持 MP4, MOV, WebM | 建议 720p 以上，光线充足</p>
            <input type="file" id="videoInput" accept="video/*" class="hidden" onchange="handleUpload(event)">
        </div>
    </section>

    <section id="progressSection" class="mb-8 hidden">
        <div class="control-panel rounded-xl p-6">
            <div class="flex justify-between mb-2">
                <span id="progressText" class="text-cyan-400">正在分析动作...</span>
                <span id="progressPercent" class="text-gray-400">0%</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-3">
                <div id="progressBar" class="progress-bar bg-gradient-to-r from-cyan-500 to-blue-500 h-3 rounded-full" style="width: 0%"></div>
            </div>
            <p class="text-sm text-gray-500 mt-2">所有处理在浏览器本地完成，视频不会上传到服务器</p>
        </div>
    </section>

    <section id="workspace" class="hidden">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <div class="lg:col-span-1 space-y-4">

                <div class="control-panel rounded-xl p-5">
                    <h3 class="font-semibold mb-3 text-cyan-400">渲染模式</h3>
                    <div class="flex gap-2">
                        <button onclick="setMode('2D')" id="btn2D" class="flex-1 py-2 px-4 bg-cyan-600 rounded-lg text-sm font-medium">2D 线条艺术</button>
                        <button onclick="setMode('3D')" id="btn3D" class="flex-1 py-2 px-4 bg-gray-700 rounded-lg text-sm font-medium hover:bg-gray-600">3D 空间雕塑</button>
                    </div>
                </div>

                <div id="controls2D" class="control-panel rounded-xl p-5 space-y-4">
                    <h3 class="font-semibold text-cyan-400">线条艺术参数</h3>

                    <div>
                        <label class="text-sm text-gray-400 flex justify-between">
                            <span>轨迹长度</span>
                            <span id="trailLengthVal">60帧</span>
                        </label>
                        <input type="range" id="trailLength" min="10" max="300" value="60" class="w-full mt-1 accent-cyan-500" oninput="updateParam('trailLength', this.value)">
                    </div>

                    <div>
                        <label class="text-sm text-gray-400 flex justify-between">
                            <span>颜色映射</span>
                            <span id="colorMapVal">速度</span>
                        </label>
                        <select id="colorMap" class="w-full mt-1 bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm" onchange="updateParam('colorMap', this.value)">
                            <option value="speed">运动速度</option>
                            <option value="joint">关节类型</option>
                            <option value="height">空间高度</option>
                            <option value="time">时间流逝</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-sm text-gray-400 flex justify-between">
                            <span>背景模式</span>
                            <span id="bgModeVal">残影拖尾</span>
                        </label>
                        <select id="bgMode" class="w-full mt-1 bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm" onchange="updateParam('bgMode', this.value)">
                            <option value="trail">残影拖尾</option>
                            <option value="black">纯黑背景</option>
                            <option value="white">纯白背景</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="showSkeleton" class="w-4 h-4 accent-cyan-500" checked onchange="updateParam('showSkeleton', this.checked)">
                        <label for="showSkeleton" class="text-sm">显示骨骼连线</label>
                    </div>
                </div>

                <div id="controls3D" class="control-panel rounded-xl p-5 space-y-4 hidden">
                    <h3 class="font-semibold text-cyan-400">3D雕塑参数</h3>

                    <div>
                        <label class="text-sm text-gray-400 flex justify-between">
                            <span>管径粗细</span>
                            <span id="tubeRadiusVal">0.05</span>
                        </label>
                        <input type="range" id="tubeRadius" min="0.01" max="0.2" step="0.01" value="0.05" class="w-full mt-1 accent-cyan-500" oninput="updateParam('tubeRadius', this.value)">
                    </div>

                    <div>
                        <label class="text-sm text-gray-400 flex justify-between">
                            <span>材质类型</span>
                            <span id="materialVal">发光</span>
                        </label>
                        <select id="materialType" class="w-full mt-1 bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm" onchange="updateParam('materialType', this.value)">
                            <option value="emissive">发光材质</option>
                            <option value="standard">标准材质</option>
                            <option value="wireframe">线框</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="autoRotate" class="w-4 h-4 accent-cyan-500" checked onchange="updateParam('autoRotate', this.checked)">
                        <label for="autoRotate" class="text-sm">自动旋转</label>
                    </div>
                </div>

                <div class="control-panel rounded-xl p-5 space-y-3">
                    <h3 class="font-semibold text-cyan-400">导出作品</h3>
                    <button onclick="exportMP4()" class="w-full py-2 px-4 bg-gradient-to-r from-cyan-600 to-blue-600 rounded-lg hover:from-cyan-500 hover:to-blue-500 transition font-medium">📹 导出 MP4</button>
                    <button onclick="exportSVG()" class="w-full py-2 px-4 bg-gray-700 rounded-lg hover:bg-gray-600 transition font-medium">🎨 导出 SVG</button>
                    <button onclick="exportPNG()" class="w-full py-2 px-4 bg-gray-700 rounded-lg hover:bg-gray-600 transition font-medium">🖼️ 导出 PNG</button>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="canvas-container control-panel rounded-xl overflow-hidden">
                    <canvas id="canvas2D"></canvas>
                    <div id="canvas3D" class="w-full h-full"></div>
                    <video id="sourceVideo" class="hidden" playsinline></video>

                    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent p-4">
                        <div class="flex items-center gap-4">
                            <button onclick="togglePlay()" id="playBtn" class="w-10 h-10 rounded-full bg-cyan-500 flex items-center justify-center hover:bg-cyan-400 transition text-black">▶</button>
                            <input type="range" id="timeSlider" min="0" max="100" value="0" class="flex-1 accent-cyan-500" oninput="seekTime(this.value)">
                            <span id="timeDisplay" class="text-sm font-mono text-gray-400">00:00 / 00:00</span>
                        </div>
                    </div>
                </div>

                <div class="mt-2 flex justify-between text-xs text-gray-500 font-mono">
                    <span id="fpsDisplay">FPS: --</span>
                    <span id="poseDisplay">关键点: --</span>
                    <span id="frameDisplay">帧: -- / --</span>
                </div>
            </div>
        </div>
    </section>
</main>

<canvas id="offscreenCanvas" class="hidden"></canvas>

<script>
class PoseDetector {
    constructor() {
        this.detector = null;
        this.modelLoaded = false;
        this.keypointNames = ['nose','leftEye','rightEye','leftEar','rightEar','leftShoulder','rightShoulder','leftElbow','rightElbow','leftWrist','rightWrist','leftHip','rightHip','leftKnee','rightKnee','leftAnkle','rightAnkle'];
    }

    async loadModel() {
        if (this.modelLoaded) return;
        updateProgressText('正在加载 AI 模型...');
        await tf.setBackend('webgl');
        this.detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, {
            modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,
            enableSmoothing: true
        });
        this.modelLoaded = true;
    }

    async processVideo(videoElement, onFrameProgress) {
        await this.loadModel();
        const canvas = document.getElementById('offscreenCanvas');
        const ctx = canvas.getContext('2d');
        const scale = 0.5;
        canvas.width = videoElement.videoWidth * scale;
        canvas.height = videoElement.videoHeight * scale;
        const fps = 30;
        const totalFrames = Math.floor(videoElement.duration * fps);
        const poses = [];
        const trails = {};
        this.keypointNames.forEach(name => trails[name] = []);

        updateProgressText('正在分析舞蹈动作...');

        for (let i = 0; i < totalFrames; i++) {
            const time = i / fps;
            videoElement.currentTime = time;
            await new Promise(resolve => {
                const onSeeked = () => { videoElement.removeEventListener('seeked', onSeeked); resolve(); };
                videoElement.addEventListener('seeked', onSeeked);
            });

            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pose = await this.detector.estimatePoses(imageData);

            if (pose.length > 0) {
                const keypoints = pose[0].keypoints;
                const frameData = { frame: i, time: time, keypoints: {} };

                keypoints.forEach((kp, idx) => {
                    const name = this.keypointNames[idx];
                    const nx = kp.x / canvas.width;
                    const ny = kp.y / canvas.height;

                    frameData.keypoints[name] = { x: nx, y: ny, score: kp.score };

                    if (trails[name].length > 0) {
                        const last = trails[name][trails[name].length - 1];
                        const dx = nx - last.x, dy = ny - last.y;
                        frameData.keypoints[name].speed = Math.sqrt(dx*dx + dy*dy);
                    } else {
                        frameData.keypoints[name].speed = 0;
                    }

                    trails[name].push({ x: nx, y: ny, frame: i, speed: frameData.keypoints[name].speed, score: kp.score });
                    if (trails[name].length > 300) trails[name].shift();
                });
                poses.push(frameData);
            }
            const progress = Math.round((i / totalFrames) * 100);
            updateProgress(progress);
            if (onFrameProgress) onFrameProgress(progress);
        }

        return { poses, trails, videoInfo: { width: videoElement.videoWidth, height: videoElement.videoHeight, duration: videoElement.duration, fps, totalFrames }};
    }
}

class Renderer2D {
    constructor() {
        this.canvas = document.getElementById('canvas2D');
        this.ctx = this.canvas.getContext('2d');
        this.params = { trailLength: 60, colorMap: 'speed', bgMode: 'trail', showSkeleton: true };
        this.trails = {};
        this.jointColors = { nose: '#fff', leftShoulder: '#f06', rightShoulder: '#f06', leftElbow: '#f48', rightElbow: '#f48', leftWrist: '#f8a', rightWrist: '#f8a', leftHip: '#60f', rightHip: '#60f', leftKnee: '#84f', rightKnee: '#84f', leftAnkle: '#a8f', rightAnkle: '#a8f' };
    }

    resize(w, h) { this.canvas.width = w; this.canvas.height = h; }
    updateParams(np) { Object.assign(this.params, np); }
    setTrails(t) { this.trails = t; }

    getColor(name, point, frameIdx) {
        const { colorMap } = this.params;
        if (colorMap === 'speed') { const s = point.speed || 0; const hue = 240 - Math.min(s * 2000, 240); return `hsla(${hue},80%,60%,${point.alpha||1})`; }
        if (colorMap === 'joint') return this.jointColors[name] || '#fff';
        if (colorMap === 'height') { const hue = 240 - (point.y * 240); return `hsla(${hue},80%,60%,${point.alpha||1})`; }
        if (colorMap === 'time') { const hue = (frameIdx * 2) % 360; return `hsla(${hue},80%,60%,${point.alpha||1})`; }
        return '#fff';
    }

    render(frameData, allPoses, frameIdx) {
        const { width, height } = this.canvas;
        const { bgMode, showSkeleton } = this.params;

        if (bgMode === 'trail') { this.ctx.fillStyle = 'rgba(10,10,10,0.08)'; this.ctx.fillRect(0,0,width,height); }
        else if (bgMode === 'black') { this.ctx.fillStyle = '#0a0a0a'; this.ctx.fillRect(0,0,width,height); }
        else if (bgMode === 'white') { this.ctx.fillStyle = '#fff'; this.ctx.fillRect(0,0,width,height); }

        this.ctx.shadowBlur = 15; this.ctx.shadowColor = 'rgba(0,212,255,0.3)';

        for (const [name, trail] of Object.entries(this.trails)) {
            if (trail.length < 2) continue;
            const visible = trail.slice(-this.params.trailLength);

            for (let i = 1; i < visible.length; i++) {
                const prev = visible[i-1], curr = visible[i];
                const x1 = prev.x * width, y1 = prev.y * height;
                const x2 = curr.x * width, y2 = curr.y * height;
                const alpha = i / visible.length;
                curr.alpha = alpha;

                this.ctx.strokeStyle = this.getColor(name, curr, frameIdx);
                this.ctx.lineWidth = Math.max(0.5, 3 * alpha);
                this.ctx.lineCap = 'round';
                this.ctx.beginPath();
                this.ctx.moveTo(x1, y1);
                this.ctx.lineTo(x2, y2);
                this.ctx.stroke();
            }
        }

        if (showSkeleton && frameData) {
            const kp = frameData.keypoints;
            this.ctx.strokeStyle = 'rgba(255,255,255,0.3)'; this.ctx.lineWidth = 1;
            const conn = [['leftShoulder','rightShoulder'],['leftShoulder','leftElbow'],['rightShoulder','rightElbow'],['leftElbow','leftWrist'],['rightElbow','rightWrist'],['leftShoulder','leftHip'],['rightShoulder','rightHip'],['leftHip','rightHip'],['leftHip','leftKnee'],['rightHip','rightKnee'],['leftKnee','leftAnkle'],['rightKnee','rightAnkle']];
            for (const [a,b] of conn) {
                if (kp[a] && kp[b] && kp[a].score > 0.3 && kp[b].score > 0.3) {
                    this.ctx.beginPath(); this.ctx.moveTo(kp[a].x*width, kp[a].y*height); this.ctx.lineTo(kp[b].x*width, kp[b].y*height); this.ctx.stroke();
                }
            }
            for (const [name, p] of Object.entries(kp)) {
                if (p.score > 0.3) { this.ctx.fillStyle = this.jointColors[name] || '#fff'; this.ctx.beginPath(); this.ctx.arc(p.x*width, p.y*height, 3, 0, Math.PI*2); this.ctx.fill(); }
            }
        }
        this.ctx.shadowBlur = 0;
    }

    exportSVG() {
        const { width, height } = this.canvas;
        let svg = `<?xml version="1.0"?><svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#0a0a0a"/>`;
        for (const [name, trail] of Object.entries(this.trails)) {
            if (trail.length < 2) continue;
            const pts = trail.map(p => `${p.x*width},${p.y*height}`).join(' ');
            svg += `<polyline points="${pts}" fill="none" stroke="${this.jointColors[name]||'#fff'}" stroke-width="1" opacity="0.6"/>`;
        }
        return svg + '</svg>';
    }

    clear() { this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }
}

class Renderer3D {
    constructor() {
        this.container = document.getElementById('canvas3D');
        this.scene = null; this.camera = null; this.renderer = null;
        this.trailMeshes = {}; this.particleSystem = null;
        this.params = { tubeRadius: 0.05, materialType: 'emissive', autoRotate: true };
        this.trails = {}; this.isInit = false; this.angle = 0;
    }

    init(w, h) {
        if (this.isInit) return;
        this.scene = new THREE.Scene(); this.scene.background = new THREE.Color(0x0a0a0a);
        this.camera = new THREE.PerspectiveCamera(75, w/h, 0.1, 1000); this.camera.position.set(5,3,8);
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); this.renderer.setSize(w,h);
        this.container.appendChild(this.renderer.domElement);
        this.scene.add(new THREE.AmbientLight(0x404040, 0.5));
        const pl = new THREE.PointLight(0xffffff, 1, 100); pl.position.set(5,10,5); this.scene.add(pl);
        const pl2 = new THREE.PointLight(0x00d4ff, 0.5, 50); pl2.position.set(-5,5,-5); this.scene.add(pl2);
        this.isInit = true; this.animate();
    }

    resize(w, h) { if (!this.isInit) return; this.camera.aspect = w/h; this.camera.updateProjectionMatrix(); this.renderer.setSize(w,h); }
    updateParams(np) { Object.assign(this.params, np); }
    setTrails(t) { this.trails = t; this.build(); }

    build() {
        for (const m of Object.values(this.trailMeshes)) { this.scene.remove(m); if (m.geometry) m.geometry.dispose(); if (m.material) m.material.dispose(); }
        this.trailMeshes = {};
        const colors = { nose: 0xffffff, leftShoulder: 0xff0066, rightShoulder: 0xff0066, leftElbow: 0xff4488, rightElbow: 0xff4488, leftWrist: 0xff88aa, rightWrist: 0xff88aa, leftHip: 0x6600ff, rightHip: 0x6600ff, leftKnee: 0x8844ff, rightKnee: 0x8844ff, leftAnkle: 0xaa88ff, rightAnkle: 0xaa88ff };

        for (const [name, trail] of Object.entries(this.trails)) {
            if (trail.length < 3) continue;
            const pts = trail.map((p,i) => new THREE.Vector3((p.x-0.5)*10, -(p.y-0.5)*10, i*0.05));
            const curve = new THREE.CatmullRomCurve3(pts); curve.tension = 0.5;
            const geo = new THREE.TubeGeometry(curve, Math.min(trail.length*2, 200), this.params.tubeRadius, 8, false);
            let mat;
            if (this.params.materialType === 'emissive') mat = new THREE.MeshStandardMaterial({ color: colors[name]||0xffffff, emissive: colors[name]||0xffffff, emissiveIntensity: 0.8, transparent: true, opacity: 0.9, roughness: 0.2, metalness: 0.8 });
            else if (this.params.materialType === 'wireframe') mat = new THREE.MeshBasicMaterial({ color: colors[name]||0xffffff, wireframe: true, transparent: true, opacity: 0.6 });
            else mat = new THREE.MeshStandardMaterial({ color: colors[name]||0xffffff, roughness: 0.5, metalness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat); mesh.name = name; this.scene.add(mesh); this.trailMeshes[name] = mesh;
        }
    }

    animate() {
        if (!this.isInit) return;
        requestAnimationFrame(() => this.animate());
        if (this.params.autoRotate) { this.angle += 0.005; this.camera.position.x = Math.sin(this.angle)*8; this.camera.position.z = Math.cos(this.angle)*8; this.camera.lookAt(0,0,0); }
        this.renderer.render(this.scene, this.camera);
    }

    clear() { if (!this.isInit) return; for (const m of Object.values(this.trailMeshes)) this.scene.remove(m); this.trailMeshes = {}; }
}

class Exporter {
    async exportMP4(canvas, dur=5000) {
        const stream = canvas.captureStream(30);
        const rec = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
        const chunks = [];
        rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        return new Promise(resolve => {
            rec.onstop = () => { const blob = new Blob(chunks, { type: 'video/webm' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `dance-art-${Date.now()}.webm`; a.click(); URL.revokeObjectURL(url); resolve(); };
            rec.start(); setTimeout(() => rec.stop(), dur);
        });
    }

    exportSVG(svg) { const blob = new Blob([svg], { type: 'image/svg+xml' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `dance-art-${Date.now()}.svg`; a.click(); URL.revokeObjectURL(url); }
    exportPNG(canvas) { const a = document.createElement('a'); a.download = `dance-art-${Date.now()}.png`; a.href = canvas.toDataURL('image/png'); a.click(); }
}

const poseDetector = new PoseDetector();
const renderer2D = new Renderer2D();
const renderer3D = new Renderer3D();
const exporter = new Exporter();

let videoElement = null, posesData = null, trailsData = null, videoInfo = null;
let currentMode = '2D', isPlaying = false, animationFrame = null, currentFrame = 0;

const els = {
    uploadSection: document.getElementById('uploadSection'),
    progressSection: document.getElementById('progressSection'),
    workspace: document.getElementById('workspace'),
    progressBar: document.getElementById('progressBar'),
    progressText: document.getElementById('progressText'),
    progressPercent: document.getElementById('progressPercent'),
    canvas2D: document.getElementById('canvas2D'),
    canvas3D: document.getElementById('canvas3D'),
    sourceVideo: document.getElementById('sourceVideo'),
    timeSlider: document.getElementById('timeSlider'),
    timeDisplay: document.getElementById('timeDisplay'),
    playBtn: document.getElementById('playBtn'),
    fpsDisplay: document.getElementById('fpsDisplay'),
    poseDisplay: document.getElementById('poseDisplay'),
    frameDisplay: document.getElementById('frameDisplay'),
    controls2D: document.getElementById('controls2D'),
    controls3D: document.getElementById('controls3D'),
    btn2D: document.getElementById('btn2D'),
    btn3D: document.getElementById('btn3D')
};

async function handleUpload(event) {
    const file = event.target.files[0]; if (!file) return;
    currentFrame = 0; isPlaying = false;
    els.uploadSection.classList.add('hidden');
    els.progressSection.classList.remove('hidden');
    videoElement = els.sourceVideo;
    videoElement.src = URL.createObjectURL(file);
    await new Promise(resolve => { videoElement.onloadedmetadata = () => { const w = videoElement.videoWidth, h = videoElement.videoHeight; renderer2D.resize(w,h); renderer3D.init(w,h); renderer3D.resize(w,h); resolve(); }; });

    try {
        const result = await poseDetector.processVideo(videoElement, updateProgress);
        posesData = result.poses; trailsData = result.trails; videoInfo = result.videoInfo;
        renderer2D.setTrails(trailsData); renderer3D.setTrails(trailsData);
        els.progressSection.classList.add('hidden');
        els.workspace.classList.remove('hidden');
        els.timeSlider.max = posesData.length - 1;
        updateTimeDisplay();
        renderFrame(0);
    } catch (err) {
        console.error('处理失败:', err);
        alert('视频处理失败，请尝试其他视频');
        els.progressSection.classList.add('hidden');
        els.uploadSection.classList.remove('hidden');
    }
}

function updateProgress(p) { els.progressBar.style.width = `${p}%`; els.progressPercent.textContent = `${p}%`; }
function updateProgressText(t) { els.progressText.textContent = t; }

function renderFrame(idx) {
    if (!posesData || idx >= posesData.length) return;
    currentFrame = idx;
    const fd = posesData[idx];
    if (currentMode === '2D') renderer2D.render(fd, posesData, idx);
    else renderer3D.updateFrame(idx);
    els.timeSlider.value = idx;
    updateTimeDisplay();
    els.frameDisplay.textContent = `帧: ${idx+1} / ${posesData.length}`;
    els.poseDisplay.textContent = `关键点: ${Object.keys(fd.keypoints).length}`;
}

function togglePlay() {
    isPlaying = !isPlaying;
    if (isPlaying) { els.playBtn.innerHTML = '⏸'; playLoop(); }
    else { els.playBtn.innerHTML = '▶'; cancelAnimationFrame(animationFrame); }
}

function playLoop() {
    if (!isPlaying) return;
    currentFrame++; if (currentFrame >= posesData.length) currentFrame = 0;
    renderFrame(currentFrame);
    animationFrame = requestAnimationFrame(playLoop);
}

function seekTime(v) { isPlaying = false; els.playBtn.innerHTML = '▶'; currentFrame = parseInt(v); renderFrame(currentFrame); }

function updateTimeDisplay() { if (!videoInfo) return; els.timeDisplay.textContent = `${(currentFrame/videoInfo.fps).toFixed(1)}s / ${videoInfo.duration.toFixed(1)}s`; }

function setMode(mode) {
    currentMode = mode;
    if (mode === '2D') { els.canvas2D.style.display = 'block'; els.canvas3D.style.display = 'none'; els.controls2D.classList.remove('hidden'); els.controls3D.classList.add('hidden'); els.btn2D.classList.replace('bg-gray-700','bg-cyan-600'); els.btn3D.classList.replace('bg-cyan-600','bg-gray-700'); renderFrame(currentFrame); }
    else { els.canvas2D.style.display = 'none'; els.canvas3D.style.display = 'block'; els.controls2D.classList.add('hidden'); els.controls3D.classList.remove('hidden'); els.btn2D.classList.replace('bg-cyan-600','bg-gray-700'); els.btn3D.classList.replace('bg-gray-700','bg-cyan-600'); }
}

function updateParam(key, value) {
    const nv = parseFloat(value), bv = value === 'true' || value === true;
    if (currentMode === '2D') {
        renderer2D.updateParams({ [key]: isNaN(nv) ? value : nv });
        if (key === 'trailLength') document.getElementById('trailLengthVal').textContent = value + '帧';
        if (key === 'colorMap') document.getElementById('colorMapVal').textContent = {speed:'速度',joint:'关节类型',height:'空间高度',time:'时间流逝'}[value];
        if (key === 'bgMode') document.getElementById('bgModeVal').textContent = {trail:'残影拖尾',black:'纯黑背景',white:'纯白背景'}[value];
    } else {
        renderer3D.updateParams({ [key]: isNaN(nv) ? (value === 'true' || value === false ? bv : value) : nv });
        if (key === 'tubeRadius') document.getElementById('tubeRadiusVal').textContent = value;
        if (key === 'materialType') document.getElementById('materialVal').textContent = {emissive:'发光',standard:'标准',wireframe:'线框'}[value];
    }
    renderFrame(currentFrame);
}

function exportMP4() { const canvas = currentMode === '2D' ? els.canvas2D : renderer3D.renderer.domElement; exporter.exportMP4(canvas, 5000); }
function exportSVG() { exporter.exportSVG(renderer2D.exportSVG()); }
function exportPNG() { const canvas = currentMode === '2D' ? els.canvas2D : renderer3D.renderer.domElement; exporter.exportPNG(canvas); }

window.addEventListener('resize', () => {
    const c = document.querySelector('.canvas-container');
    const w = c.clientWidth, h = c.clientHeight;
    renderer2D.resize(w,h); renderer3D.resize(w,h);
});
</script>
</body>
</html>
